[workspace]
members = ["crates/avs-core", "crates/avs-session", "crates/avs-render", "crates/avs-handoff", "crates/avs-app", "crates/avs-mcp"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
strip = true
lto = "thin"
